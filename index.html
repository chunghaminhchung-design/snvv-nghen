<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>🎂 Thiệp Mời Sinh Nhật</title>
    <style>
        body {
            background: linear-gradient(135deg, #fbc2eb, #a6c1ee);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .card-invite {
            background: white;
            border-radius: 30px;
            padding: 40px;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }
        .card-invite h1 {
            color: #d6336c;
            font-size: 28px;
        }
        .card-invite .cake-emoji {
            font-size: 80px;
        }
        .card-invite .qr-code {
            margin: 20px 0;
        }
        .card-invite .qr-code img {
            border-radius: 16px;
            border: 3px solid #f0d0e0;
        }
        .card-invite .note {
            color: #777;
            font-size: 16px;
            margin-top: 10px;
        }
        .card-invite .btn-print {
            background: #d6336c;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 30px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 15px;
        }
        @media print {
            .btn-print { display: none; }
            .card-invite { box-shadow: none; border: 2px solid #ddd; }
        }
    </style>
</head>
<body>
    <div class="card-invite">
        <div class="cake-emoji">🎂</div>
        <h1>🎉 Mời Chị Đến Nhận Quà!</h1>
        <p>Quét mã QR bên dưới để mở bất ngờ nhé! 💝</p>
        
        <div class="qr-code">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=https://chunghaminhchung-design.github.io/snvv-nghen/" alt="QR Code" />
        </div>
        
        <p class="note">📱 Quét mã hoặc truy cập:<br>
        <strong>chunghaminhchung-design.github.io/snvv-nghen</strong></p>
        
        <button class="btn-print" onclick="window.print()">🖨️ In thiệp</button>
    </div>
</body>
</html>
