<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎂 Chúc Mừng Sinh Nhật Chị!</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#fbc2eb,#a6c1ee);overflow:hidden}
        .card{background:rgba(255,255,255,0.9);border-radius:30px;padding:30px 25px;max-width:420px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.15);z-index:10;position:relative}
        .hidden{display:none !important}
        .emoji-big{font-size:50px}
        h1{font-size:24px;color:#d6336c;margin:8px 0}
        .sub{font-size:15px;color:#777;margin-bottom:16px}
        .keypad{display:flex;flex-direction:column;gap:8px;align-items:center;margin:12px 0}
        .key-row{display:flex;gap:10px}
        .key{width:55px;height:55px;border-radius:16px;border:none;font-size:22px;font-weight:bold;background:white;box-shadow:0 4px 8px rgba(0,0,0,0.08);cursor:pointer;transition:0.1s;border:1px solid #eee}
        .key:active{transform:scale(0.92);background:#f0d0e0}
        .key-clear{color:#e74c3c}
        .key-enter{background:#d6336c;color:white}
        .display{font-size:28px;font-weight:bold;color:#d6336c;background:#faf0f3;padding:10px;border-radius:16px;min-height:50px;margin:8px 0;letter-spacing:4px}
        .error{color:#e74c3c;font-size:14px;margin-top:6px}
        .option-btn{display:block;width:100%;padding:12px 16px;margin:6px 0;border-radius:12px;border:2px solid #eee;background:white;font-size:15px;cursor:pointer;transition:0.2s;text-align:left}
        .option-btn:hover{border-color:#d6336c;background:#faf0f3}
        .option-btn.correct{background:#2ecc71;color:white;border-color:#2ecc71}
        .option-btn.wrong{background:#e74c3c;color:white;border-color:#e74c3c}
        .option-btn:disabled{opacity:0.7;cursor:not-allowed}
        .letter-display{background:#fff5f7;border-radius:20px;padding:24px 16px;min-height:150px;margin:12px 0}
        .letter-emoji-big{font-size:48px}
        .letter-content-full{font-size:17px;color:#444;line-height:1.6;margin-top:8px}
        .letter-nav{display:flex;gap:12px;justify-content:center;margin-top:12px}
        .letter-nav button{padding:10px 24px;border-radius:30px;border:none;background:#d6336c;color:white;font-size:15px;cursor:pointer;font-weight:bold}
        .letter-nav button:disabled{opacity:0.4;cursor:not-allowed}
        .letter-nav span{font-size:18px;color:#d6336c;padding:0 10px}
        .result-text{font-size:18px;font-weight:bold;color:#d6336c;margin:10px 0}
        #transferOverlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px}
        #transferOverlay .transfer-card{background:white;border-radius:30px;padding:30px 25px;max-width:400px;width:100%;text-align:center;animation:popIn 0.3s ease}
        @keyframes popIn{0%{transform:scale(0.8);opacity:0}100%{transform:scale(1);opacity:1}}
        #transferOverlay input{width:100%;padding:12px 16px;border:2px solid #f0d0e0;border-radius:16px;font-size:18px;margin:8px 0;outline:none}
        #transferOverlay input:focus{border-color:#d6336c}
        #transferOverlay .btn-primary{width:100%;padding:14px;background:linear-gradient(135deg,#f093fb,#f5576c);border:none;border-radius:30px;font-size:18px;font-weight:bold;color:white;cursor:pointer;margin-top:8px}
        #loveOverlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(214,51,108,0.92);z-index:9999;display:flex;align-items:center;justify-content:center;cursor:pointer;animation:fadeIn 0.3s ease}
        #loveText{font-size:40px;font-weight:900;color:white;text-shadow:0 0 30px rgba(255,255,255,0.5);transition:all 0.3s ease;user-select:none}
        @keyframes fadeIn{0%{transform:scale(0.5);opacity:0}100%{transform:scale(1);opacity:1}}
        @keyframes trollPop{0%{transform:scale(0.3) rotate(-10deg);opacity:0}100%{transform:scale(1) rotate(0deg);opacity:1}}
        .troll-card{background:linear-gradient(135deg,#ff6b6b,#ee5a24);border-radius:40px;padding:40px;max-width:400px;width:100%;text-align:center;animation:trollPop 0.6s ease}
        .troll-card h1{color:white;font-size:42px;font-weight:900}
        .troll-card p{color:rgba(255,255,255,0.9);font-size:18px;margin:12px 0}
        .troll-card button{margin-top:16px;padding:14px 40px;background:white;border:none;border-radius:50px;font-size:18px;font-weight:bold;color:#ee5a24;cursor:pointer}
        .qr-img{width:180px;height:180px;border-radius:16px;border:3px solid #f0d0e0;object-fit:contain;background:white}
        @media(max-width:480px){.card{padding:20px 16px}.key{width:48px;height:48px;font-size:18px}.emoji-big{font-size:40px}h1{font-size:20px}.qr-img{width:140px;height:140px}}
    </style>
</head>
<body>

    <!-- Bong bóng nền -->
    <div id="bubbles" style="position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:hidden;"></div>

    <!-- ===== TRANG ĐĂNG NHẬP ===== -->
    <div class="card" id="loginPage">
        <div class="emoji-big">🔐</div>
        <h1>🎂 Nhập mật khẩu</h1>
        <p class="sub">Nhập mã để nhận quà từ em nhé!</p>
        <div class="keypad">
            <div class="key-row">
                <button class="key" onclick="pressKey('1')">1</button>
                <button class="key" onclick="pressKey('2')">2</button>
                <button class="key" onclick="pressKey('3')">3</button>
            </div>
            <div class="key-row">
                <button class="key" onclick="pressKey('4')">4</button>
                <button class="key" onclick="pressKey('5')">5</button>
                <button class="key" onclick="pressKey('6')">6</button>
            </div>
            <div class="key-row">
                <button class="key" onclick="pressKey('7')">7</button>
                <button class="key" onclick="pressKey('8')">8</button>
                <button class="key" onclick="pressKey('9')">9</button>
            </div>
            <div class="key-row">
                <button class="key key-clear" onclick="pressKey('clear')">⌫</button>
                <button class="key" onclick="pressKey('0')">0</button>
                <button class="key key-enter" onclick="pressKey('enter')">↵</button>
            </div>
        </div>
        <div class="display" id="display">❤️</div>
        <div id="errorMsg" class="error hidden">❌ Sai mật khẩu rồi! Thử lại nhé!</div>
    </div>

    <!-- ===== TRANG CÂU HỎI ===== -->
    <div class="card hidden" id="quizPage">
        <div class="emoji-big">🤔</div>
        <h1>📝 Trắc Nghiệm</h1>
        <p class="sub" id="questionCounter">Câu 1 / 5</p>
        <div id="questionText" style="font-size:18px;font-weight:600;margin:12px 0;min-height:50px;">Câu hỏi...</div>
        <div id="optionsContainer"></div>
        <div id="quizResult" class="hidden"><p class="result-text" id="resultText"></p></div>
    </div>

    <!-- ===== TRANG LÁ THƯ ===== -->
    <div class="card hidden" id="letterPage">
        <div class="emoji-big">💌</div>
        <h1>🎉 Những Lá Thư Cho Chị!</h1>
        <p class="sub" id="letterCounter">Lá thư 1 / 5</p>
        <div class="letter-display">
            <div class="letter-emoji-big" id="letterEmoji">💖</div>
            <div class="letter-content-full" id="letterContent">Chị à, em chúc chị luôn vui vẻ và hạnh phúc! Chị xứng đáng với những điều tốt đẹp nhất trên đời này. 🌸</div>
        </div>
        <div class="letter-nav">
            <button id="prevBtn">⬅️ Trước</button>
            <span id="pageDot">● ○ ○ ○ ○</span>
            <button id="nextBtn">Sau ➡️</button>
        </div>
    </div>

    <script>
        // ===== BONG BÓNG =====
        (function() {
            const c = document.getElementById('bubbles');
            for (let i = 0; i < 30; i++) {
                const b = document.createElement('div');
                const s = 15 + Math.random() * 35;
                b.style.cssText = 'position:absolute;bottom:-' + s + 'px;left:' + Math.random() * 100 +
                    '%;width:' + s + 'px;height:' + s + 'px;border-radius:50%;background:radial-gradient(circle at 30% 30%, rgba(255,255,255,0.5), rgba(255,255,255,0.1));animation:rise ' +
                    (12 + Math.random() * 20) + 's linear infinite;animation-delay:' + Math.random() * 10 +
                    's;opacity:' + (0.3 + Math.random() * 0.4) + ';';
                c.appendChild(b);
            }
            const style = document.createElement('style');
            style.textContent =
                '@keyframes rise{0%{transform:translateY(0) scale(1);opacity:0.6}100%{transform:translateY(-110vh) scale(1.5);opacity:0}}';
            document.head.appendChild(style);
        })();

        // ===== MẬT KHẨU =====
        const PASSWORD = '492006';
        let input = '';
        const display = document.getElementById('display');
        const errorMsg = document.getElementById('errorMsg');
        const loginPage = document.getElementById('loginPage');
        const quizPage = document.getElementById('quizPage');
        const letterPage = document.getElementById('letterPage');

        function pressKey(val) {
            if (val === 'clear') { input = input.slice(0, -1); } else if (val === 'enter') {
                if (input === PASSWORD) {
                    loginPage.classList.add('hidden');
                    quizPage.classList.remove('hidden');
                    errorMsg.classList.add('hidden');
                    input = '';
                    display.textContent = '❤️';
                    startQuiz();
                    return;
                } else {
                    errorMsg.classList.remove('hidden');
                    input = '';
                    display.textContent = '❤️';
                    setTimeout(() => errorMsg.classList.add('hidden'), 2000);
                    return;
                }
            } else { if (input.length < 6) { input += val; } }
            display.textContent = input.length > 0 ? input : '❤️';
        }

        document.addEventListener('keydown', function(e) {
            const key = e.key;
            if (key >= '0' && key <= '9') { e.preventDefault();
                pressKey(key); } else if (key === 'Backspace') { e.preventDefault();
                pressKey('clear'); } else if (key === 'Enter') { e.preventDefault();
                pressKey('enter'); }
        });

        // ===== CÂU HỎI =====
        const questions = [{
            question: "📌 Em sinh năm bao nhiêu?",
            options: ["A. 2000", "B. 2001", "C. 2002", "D. 2003"],
            correct: 2
        }, {
            question: "📌 Màu sắc em yêu thích nhất là gì?",
            options: ["A. Đỏ", "B. Xanh dương", "C. Hồng", "D. Tím"],
            correct: 2
        }, {
            question: "📌 Em thích ăn món gì nhất?",
            options: ["A. Bánh mì", "B. Phở", "C. Cơm rang", "D. Mì tôm"],
            correct: 1
        }, {
            question: "📌 Sở thích của em là gì?",
            options: ["A. Đá bóng", "B. Nghe nhạc", "C. Lập trình", "D. Du lịch"],
            correct: 2
        }, {
            question: "💖 Chị có quý em không?",
            options: ["Có 💕", "Không 😢"],
            correct: 0,
            isFinal: true
        }];

        let currentQuestion = 0;
        const questionText = document.getElementById('questionText');
        const optionsContainer = document.getElementById('optionsContainer');
        const questionCounter = document.getElementById('questionCounter');
        const quizResult = document.getElementById('quizResult');
        const resultText = document.getElementById('resultText');

        function startQuiz() { currentQuestion = 0;
            quizResult.classList.add('hidden');
            renderQuestion(); }

        function renderQuestion() {
            const q = questions[currentQuestion];
            questionText.textContent = q.question;
            questionCounter.textContent = 'Câu ' + (currentQuestion + 1) + ' / ' + questions.length;
            optionsContainer.innerHTML = '';
            q.options.forEach(function(opt, index) {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = opt;
                btn.dataset.index = index;
                btn.onclick = function() { handleAnswer(parseInt(this.dataset.index)); };
                optionsContainer.appendChild(btn);
            });
            quizResult.classList.add('hidden');
        }

        function handleAnswer(index) {
            const q = questions[currentQuestion];
            const btns = optionsContainer.querySelectorAll('.option-btn');
            if (q.isFinal) {
                if (index === 0) { showLoveQR(); } else { growLoveText(); }
                return;
            }
            btns.forEach(function(btn, i) {
                btn.disabled = true;
                if (i === q.correct) btn.classList.add('correct');
                else if (i === index && i !== q.correct) btn.classList.add('wrong');
            });
            if (index === q.correct) { resultText.textContent = '✅ Đúng rồi! Chị giỏi quá! 🌟'; } else { resultText
                    .textContent = '❌ Sai rồi! Đáp án đúng là ' + q.options[q.correct]; }
            quizResult.classList.remove('hidden');
            setTimeout(function() {
                if (currentQuestion < questions.length - 1) { currentQuestion++;
                    renderQuestion(); } else {
                    quizPage.classList.add('hidden');
                    letterPage.classList.remove('hidden');
                    currentLetter = 0;
                    updateLetter(0);
                    startAutoSlide();
                }
            }, 1500);
        }

        // ===== XỬ LÝ "KHÔNG" - CHỮ CÓ TO DẦN =====
        let noClickCount = 0;
        let loveOverlay = null;

        function growLoveText() {
            if (!loveOverlay) {
                loveOverlay = document.createElement('div');
                loveOverlay.id = 'loveOverlay';
                const text = document.createElement('div');
                text.id = 'loveText';
                text.textContent = '💖 CÓ 💖';
                loveOverlay.appendChild(text);
                document.body.appendChild(loveOverlay);
                loveOverlay.onclick = function() {
                    noClickCount++;
                    const textEl = document.getElementById('loveText');
                    if (textEl) {
                        const sizes = [40, 60, 80, 120, 200, 300];
                        const idx = Math.min(noClickCount, sizes.length - 1);
                        textEl.style.fontSize = sizes[idx] + 'px';
                        textEl.style.transition = 'font-size 0.3s ease';
                        if (noClickCount >= sizes.length - 1) {
                            setTimeout(function() {
                                if (loveOverlay) { loveOverlay.remove();
                                    loveOverlay = null; }
                                quizPage.classList.add('hidden');
                                letterPage.classList.remove('hidden');
                                currentLetter = 0;
                                updateLetter(0);
                                startAutoSlide();
                            }, 600);
                        }
                    }
                };
            } else { loveOverlay.click(); }
        }

        // ===== XỬ LÝ "CÓ" - HIỆN QR =====
        function showLoveQR() {
            quizPage.classList.add('hidden');
            showTransferPage();
        }

        // ===== QR + CHUYỂN TIỀN (BỎ NÚT BỎ QUA) =====
        function showTransferPage() {
            const QR_LINK = 'https://img.vietqr.io/image/MB-0388888888-compact.png?amount=0&addInfo=Chuc%20mung%20sinh%20nhat&accountName=NGUYEN%20VAN%20A';
            const overlay = document.createElement('div');
            overlay.id = 'transferOverlay';
            overlay.innerHTML = `
                <div class="transfer-card">
                    <div style="font-size:48px;">💝</div>
                    <h2 style="color:#d6336c;font-size:22px;margin:4px 0;">Chị thương em bao nhiêu?</h2>
                    <p style="color:#888;font-size:14px;">Số tiền chị chuyển sẽ thể hiện tình cảm dành cho em đó!</p>
                    <div style="margin:12px 0;">
                        <img src="${QR_LINK}" class="qr-img" alt="QR Code" />
                        <p style="font-size:12px;color:#999;margin-top:6px;">📱 Quét mã QR để chuyển khoản</p>
                    </div>
                    <div style="margin:12px 0;">
                        <p style="font-size:14px;color:#666;">Ngân hàng: <strong>MB Bank</strong></p>
                        <p style="font-size:14px;color:#666;">Số TK: <strong id="accountNumber">0388888888</strong></p>
                        <p style="font-size:14px;color:#666;">Chủ TK: <strong id="accountName">NGUYEN VAN A</strong></p>
                    </div>
                    <div style="margin:12px 0;">
                        <label style="font-size:14px;color:#666;display:block;text-align:left;">💰 Số tiền (VND):</label>
                        <input type="number" id="transferAmount" placeholder="Nhập số tiền..." />
                        <p style="font-size:12px;color:#999;margin-top:4px;">💡 Số tiền tùy vào mức độ quý mến!</p>
                    </div>
                    <button class="btn-primary" id="transferBtn">💸 Chuyển khoản ngay</button>
                </div>
            `;
            document.body.appendChild(overlay);

            document.getElementById('transferBtn').onclick = function() {
                const amount = document.getElementById('transferAmount').value;
                if (!amount || amount <= 0) { alert('💝 Chị ơi, hãy nhập số tiền em nhé!'); return; }
                showTrollMessage(overlay);
            };
        }

        // ===== TROLL =====
        function showTrollMessage(overlay) {
            overlay.innerHTML = `
                <div class="troll-card">
                    <div style="font-size:72px;">🤡</div>
                    <h1>TROLL!!!</h1>
                    <p>🤣 Chị bị lừa rồi!<br>Đây chỉ là trang web tình cảm thôi! 💕</p>
                    <div style="font-size:56px;">😝</div>
                    <button id="trollContinueBtn">💌 Đọc thư đi nào!</button>
                </div>
            `;
            document.getElementById('trollContinueBtn').onclick = function() {
                overlay.remove();
                quizPage.classList.add('hidden');
                letterPage.classList.remove('hidden');
                currentLetter = 0;
                updateLetter(0);
                startAutoSlide();
            };
        }

        // ===== LÁ THƯ =====
        const letters = [
            { emoji: '💖', content: 'Chị à, em chúc chị luôn vui vẻ và hạnh phúc! Chị xứng đáng với những điều tốt đẹp nhất trên đời này. 🌸' },
            { emoji: '🌟', content: 'Cảm ơn chị vì luôn bên em, chăm sóc và yêu thương em. Em may mắn khi có chị trong cuộc đời! 🥰' },
            { emoji: '🌈', content: 'Chúc chị năm mới tuổi mới thật nhiều niềm vui, sức khỏe và thành công trong mọi dự định! 🎊' },
            { emoji: '🌺', content: 'Chị luôn là nguồn cảm hứng và là hình mẫu của em. Em yêu chị rất nhiều! Mong chị luôn xinh đẹp và rạng rỡ! ✨' },
            { emoji: '🎁', content: 'Tuổi mới, chị hãy sống thật vui và thật ý nghĩa nhé! Em luôn ủng hộ và yêu thương chị! 💕' }
        ];

        let currentLetter = 0;
        let autoSlideTimer = null;
        const letterEmoji = document.getElementById('letterEmoji');
        const letterContent = document.getElementById('letterContent');
        const letterCounter = document.getElementById('letterCounter');
        const pageDot = document.getElementById('pageDot');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');

        function updateLetter(index) {
            const letter = letters[index];
            letterEmoji.textContent = letter.emoji;
            letterContent.textContent = letter.content;
            letterCounter.textContent = 'Lá thư ' + (index + 1) + ' / ' + letters.length;
            let dots = '';
            for (let i = 0; i < letters.length; i++) { dots += i === index ? '●' : '○'; }
            pageDot.textContent = dots;
            prevBtn.disabled = index === 0;
            nextBtn.disabled = index === letters.length - 1;
        }

        function nextLetter() {
            if (currentLetter < letters.length - 1) { currentLetter++;
                updateLetter(currentLetter); } else { currentLetter = 0;
                updateLetter(currentLetter); }
        }

        function startAutoSlide() { if (autoSlideTimer) clearInterval(autoSlideTimer);
            autoSlideTimer = setInterval(nextLetter, 4000); }

        prevBtn.onclick = function() {
            if (currentLetter > 0) { currentLetter--;
                updateLetter(currentLetter);
                clearInterval(autoSlideTimer);
                setTimeout(startAutoSlide, 5000); }
        };
        nextBtn.onclick = function() {
            if (currentLetter < letters.length - 1) { currentLetter++;
                updateLetter(currentLetter);
                clearInterval(autoSlideTimer);
                setTimeout(startAutoSlide, 5000); }
        };
        updateLetter(0);
    </script>
</body>
</html>
